<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Elite</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

/* HEADER */
header {
  padding: 40px 20px;
  background: linear-gradient(45deg, #000, #1a1a1a);
}

h1 {
  font-size: 36px;
}

p {
  color: #ccc;
}

/* BOTÃO WHATS */
.btn-main {
  display: inline-block;
  margin-top: 20px;
  padding: 15px 30px;
  background: #25d366;
  color: white;
  border-radius: 30px;
  font-weight: bold;
  text-decoration: none;
  font-size: 18px;
}

/* HORÁRIOS */
.horarios {
  padding: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 400px;
  margin: auto;
}

.horario {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.horario:hover {
  background: #25d366;
}

/* GALERIA */
.galeria {
  padding: 20px;
}

.galeria img {
  width: 90%;
  max-width: 300px;
  margin: 10px;
  border-radius: 10px;
}

/* REDES */
.redes {
  margin-top: 20px;
}

.instagram {
  display: inline-block;
  margin: 10px;
  padding: 12px 25px;
  border-radius: 30px;
  background: linear-gradient(45deg, #fd1d1d, #833ab4);
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.facebook {
  display: inline-block;
  margin: 10px;
  padding: 12px 25px;
  border-radius: 30px;
  background: #1877f2;
  color: white;
  text-decoration: none;
}

/* LOCALIZAÇÃO */
.mapa {
  margin-top: 20px;
}

iframe {
  border-radius: 10px;
}

/* FOOTER */
footer {
  margin-top: 40px;
  padding: 20px;
  background: #000;
}
</style>
</head>

<body>

<header>
  <h1>💈 Barbearia Elite</h1>
  <p>Agende rápido pelo WhatsApp</p>

  <a class="btn-main" href="https://wa.me/554195179344">
    Falar no WhatsApp
  </a>
</header>

<section class="horarios">
  <h2>Escolha um horário</h2>

  <div class="grid">
    <div class="horario" onclick="agendar('09:00')">09:00</div>
    <div class="horario" onclick="agendar('10:00')">10:00</div>
    <div class="horario" onclick="agendar('11:00')">11:00</div>
    <div class="horario" onclick="agendar('14:00')">14:00</div>
    <div class="horario" onclick="agendar('15:00')">15:00</div>
    <div class="horario" onclick="agendar('16:00')">16:00</div>
  </div>
</section>

<section class="galeria">
  <h2>Alguns cortes</h2>

  <img src="https://images.unsplash.com/photo-1512690459411-b9245aed614b">
  <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70">
  <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a">
</section>

<section class="redes">
  <h2>Redes sociais</h2>

  <a class="instagram" href="#">Ver no Instagram</a>
  <a class="facebook" href="#">Facebook</a>
</section>

<section class="mapa">
  <h2>Localização</h2>
  <iframe 
    src="https://www.google.com/maps?q=Curitiba&output=embed"
    width="90%" height="250">
  </iframe>
</section>

<footer>
  Atendimento rápido via WhatsApp
</footer>

<script>
function agendar(horario) {
  const msg = `Olá, quero agendar um corte às ${horario} 💈 Está disponível?`;
  const url = `https://wa.me/554195179344?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
