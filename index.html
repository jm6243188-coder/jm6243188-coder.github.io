<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendamento Barbearia</title>
  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #222;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }
    input, select, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: none;
      border-radius: 5px;
    }
    button {
      background: #00c853;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>Agendar Horário</h2>

  <form action="https://hook.us2.make.com/79uy1f6bk57kziqm5ka5qbr3wqnne8bk" method="GET">
    
    <input type="text" name="nome" placeholder="Seu nome" required>

    <select name="horario" required>
      <option value="">Escolha um horário</option>
      <option>09:00</option>
      <option>10:00</option>
      <option>11:00</option>
      <option>14:00</option>
      <option>15:00</option>
      <option>16:00</option>
    </select>

    <button type="submit">Agendar</button>

  </form>
</div>

</body>
</html>
