<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barbearia Elite</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0a0a0a;
  color: white;
  text-align: center;
}

/* HEADER */
header {
  padding: 40px 20px;
  background: linear-gradient(45deg, #000, #1a1a1a);
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

p {
  color: #ccc;
}

/* BOTÃO PRINCIPAL */
.btn-main {
  display: inline-block;
  margin-top: 20px;
  padding: 15px 30px;
  background: #25d366;
  color: white;
  border-radius: 30px;
  font-weight: bold;
  text-decoration: none;
  font-size: 18px;
}

/* HORÁRIOS */
.horarios {
  padding: 30px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  max-width: 400px;
  margin: auto;
}

.horario {
  background: #1c1c1c;
  padding: 15px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.horario:hover {
  background: #25d366;
}

/* RODAPÉ */
footer {
  margin-top: 40px;
  padding: 20px;
  background: #000;
}
</style>
</head>

<body>

<header>
  <h1>💈 Barbearia Elite</h1>
  <p>Escolha um horário e agende rápido</p>

  <a class="btn-main" href="https://wa.me/554195179344">
    Falar no WhatsApp
  </a>
</header>

<section class="horarios">
  <h2>Escolha um horário</h2>

  <div class="grid">

    <div class="horario" onclick="agendar('09:00')">09:00</div>
    <div class="horario" onclick="agendar('10:00')">10:00</div>
    <div class="horario" onclick="agendar('11:00')">11:00</div>
    <div class="horario" onclick="agendar('14:00')">14:00</div>
    <div class="horario" onclick="agendar('15:00')">15:00</div>
    <div class="horario" onclick="agendar('16:00')">16:00</div>

  </div>
</section>

<footer>
  Atendimento rápido via WhatsApp
</footer>

<script>
function agendar(horario) {
  const msg = `Olá, quero agendar um corte às ${horario} 💈 Está disponível?`;
  const url = `https://wa.me/554195179344?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
